<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   viewport-fit=cover">

    <meta name="theme-color" content="#F2F2F7">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Matteo Terzaghi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100svh;

            background: #F2F2F7;

            font-family: "PT Sans", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(30px, env(safe-area-inset-top))
                20px
                max(30px, env(safe-area-inset-bottom))
                20px;

        }


        /* CONTENITORE */

        .business-card-wrapper {

            width: 100%;
            max-width: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;

        }


        /* LOGO SOPRA LA CARD */

        .logo {

            display: block;

            width: 150px;
            height: auto;

            object-fit: contain;

            margin-bottom: 20px;

            /*
             * Leggera ombra per dare
             * profondità anche al logo
             */

            filter:
                drop-shadow(0 5px 8px rgba(0,0,0,0.10));

        }


        /* CARD */

        .card {

            width: 100%;

            padding: 34px 30px 30px;

            border-radius: 28px;

            background: rgb(55,111,128);

            color: #FFFFFF;

            border: 1px solid rgba(255,255,255,0.38);

            box-shadow:

                0 30px 60px rgba(0,0,0,0.18),

                0 10px 24px rgba(0,0,0,0.12),

                0 2px 5px rgba(0,0,0,0.08),

                inset 0 1px 0 rgba(255,255,255,0.20);

        }


        /* NOME */

        .name {

            font-size: 32px;

            line-height: 1.1;

            font-weight: 700;

            letter-spacing: -0.4px;

        }


        /* RUOLO */

        .role {

            margin-top: 7px;

            font-size: 18px;

            line-height: 1.3;

            color: rgba(255,255,255,0.92);

        }


        .department {

            margin-top: 2px;

            font-size: 16px;

            line-height: 1.3;

            color: rgba(255,255,255,0.72);

        }


        /* SEPARATORI */

        .separator {

            height: 1px;

            margin: 25px 0;

            background: rgba(255,255,255,0.25);

        }


        /* CONTATTI */

        .contacts {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .contact {

            display: flex;

            align-items: baseline;

            gap: 10px;

            font-size: 16px;

            line-height: 1.35;

        }


        .label {

            width: 72px;

            flex-shrink: 0;

            font-size: 14px;

            color: rgba(255,255,255,0.58);

        }


        .value {

            color: #FFFFFF;

            text-decoration: none;

            word-break: break-word;

        }


        a.value:active {

            opacity: 0.65;

        }


        /* AZIENDA */

        .company {

            font-size: 15px;

            line-height: 1.4;

            font-weight: 700;

        }


        .address {

            margin-top: 3px;

            font-size: 14px;

            line-height: 1.4;

            color: rgba(255,255,255,0.72);

        }


        .website {

            color: #FFFFFF;

            text-decoration: none;

        }


        /* SCHERMI PICCOLI */

        @media (max-width: 380px) {

            .logo {
                width: 125px;
                margin-bottom: 17px;
            }

            .card {
                padding: 28px 24px 25px;
                border-radius: 24px;
            }

            .name {
                font-size: 29px;
            }

            .role {
                font-size: 17px;
            }

            .contact {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <main class="business-card-wrapper">


        <!-- LOGO FUORI DALLA CARD -->
        <!-- Sostituisci logo.png con il tuo logo -->

        <img
            class="logo"
            src="logo.PNG"
            alt="Logo"
        >


        <!-- CARD -->

        <section class="card">


            <h1 class="name">
                Matteo Terzaghi
            </h1>


            <p class="role">
                Direzione Sistemi Informativi
            </p>


            <p class="department">
                Information Technology
            </p>


            <div class="separator"></div>


            <div class="contacts">


                <div class="contact">

                    <span class="label">
                        telefono
                    </span>

                    <a
                        class="value"
                        href="tel:+390382592511"
                    >
                        +39 0382 592511
                    </a>

                </div>


                <div class="contact">

                    <span class="label">
                        cellulare
                    </span>

                    <a
                        class="value"
                        href="tel:+393456595216"
                    >
                        +39 345 6595216
                    </a>

                </div>


                <div class="contact">

                    <span class="label">
                        e-mail
                    </span>

                    <a
                        class="value"
                        href="mailto:matteo.terzaghi@icsmaugeri.it"
                    >
                        matteo.terzaghi@icsmaugeri.it
                    </a>

                </div>


            </div>


            <div class="separator"></div>


            <section>


                <p class="company">
                    Istituti Clinici Scientifici
                    Maugeri SpA Società Benefit
                </p>


                <p class="address">

                    Via Salvatore Maugeri, 4 -
                    27100 Pavia |

                    <a
                        class="website"
                        href="https://www.icsmaugeri.it"
                        target="_blank"
                        rel="noopener"
                    >
                        icsmaugeri.it
                    </a>

                </p>


            </section>


        </section>


    </main>


</body>

</html>
